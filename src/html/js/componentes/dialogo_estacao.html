<dialog class="dialogo-estacao">
    <form class="formulario-estacao" data-on='{"submit":"aoEnviar"}'>
        <h2>{{ titulo }}</h2>
        <label>Nome da estação (opcional)
            <input type="text" name="nome" maxlength="60" />
        </label>
        <label class="campo-amarracao" data-bind='{"hidden":"semAmarracao"}'>Amarrar a
            <select name="amarrada_a">
                <option value="">Nenhuma (esta será uma referência independente)</option>
                <template data-for="e in estacoesParaAmarrar : id">
                    <option data-bind='{"value":"e.id"}'>{{ e.nome }}</option>
                </template>
            </select>
        </label>
        <p class="ajuda-campo">Posição do laser (opcional): só serve para marcá-lo no mapa.</p>
        <campo-coordenada></campo-coordenada>
        <div class="acoes-formulario">
            <button type="submit" class="botao-primario">{{ rotuloSalvar }}</button>
            <button type="button" data-acao="cancelar-estacao" data-on='{"click":"fechar"}'>Cancelar</button>
        </div>
    </form>
</dialog>
